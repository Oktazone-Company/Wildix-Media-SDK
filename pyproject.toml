[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "wildix-media-sdk"
version = "0.1.0"
description = "A small async SIP/RTP server for bidirectional Wildix voice media."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [
  { name = "OktaZone Company" },
]
keywords = ["sip", "rtp", "wildix", "voice-ai", "telephony"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Framework :: AsyncIO",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Communications :: Telephony",
]
dependencies = [
  "aiosipua[rtp]>=0.7.1,<0.8",
  "python-dotenv>=1.1,<2",
]

[project.optional-dependencies]
ai = [
  "faster-whisper>=1.2,<2",
  "pyttsx3>=2.99,<3",
]
dev = [
  "build>=1.2,<2",
  "mypy>=1.18,<2",
  "pytest>=8.4,<9",
  "pytest-asyncio>=1.1,<2",
  "ruff>=0.12,<1",
]

[project.scripts]
wildix-media-echo = "wildix_media.cli:main"

[project.urls]
Documentation = "https://github.com/Oktazone-Company/wildix-media-sdk#readme"
Repository = "https://github.com/Oktazone-Company/wildix-media-sdk"

[tool.hatch.build.targets.wheel]
packages = ["src/wildix_media"]

[tool.pytest.ini_options]
addopts = "-ra"
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true
packages = ["wildix_media"]

[[tool.mypy.overrides]]
module = ["aiosipua", "aiosipua.*"]
ignore_missing_imports = true
